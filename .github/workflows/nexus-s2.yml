name: Nexus S2 Repo + Data
on:
  repository_dispatch:
    types: [nexus-s2]
  workflow_dispatch:

jobs:
  migrate:
    name: Apply Supabase Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply foundation migration (001 — 9 tables)
        env:
          SUPABASE_DB_URL:      ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=0 -f supabase/migrations/001_nexus_foundation.sql
            echo "✅ Migration 001 applied"
          elif [ -n "$SUPABASE_DB_PASSWORD" ]; then
            PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
              -h aws-0-us-west-2.pooler.supabase.com -p 5432 \
              -U "postgres.mocerqjnksmhcjzxrewo" -d postgres \
              -v ON_ERROR_STOP=0 \
              -f supabase/migrations/001_nexus_foundation.sql
            echo "✅ Migration 001 applied via password"
          else
            echo "⚠️  No DB credentials — skipping (add SUPABASE_DB_URL secret to apply)"
          fi

      - name: Apply cron jobs migration (002)
        env:
          SUPABASE_DB_URL:      ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=0 -f supabase/migrations/002_cron_jobs.sql || true
            echo "✅ Migration 002 applied"
          elif [ -n "$SUPABASE_DB_PASSWORD" ]; then
            PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
              -h aws-0-us-west-2.pooler.supabase.com -p 5432 \
              -U "postgres.mocerqjnksmhcjzxrewo" -d postgres \
              -v ON_ERROR_STOP=0 \
              -f supabase/migrations/002_cron_jobs.sql || true
          fi

      - name: Apply data scanner functions (003)
        env:
          SUPABASE_DB_URL:      ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=0 -f supabase/migrations/003_data_scanner_functions.sql || true
            echo "✅ Migration 003 applied"
          elif [ -n "$SUPABASE_DB_PASSWORD" ]; then
            PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
              -h aws-0-us-west-2.pooler.supabase.com -p 5432 \
              -U "postgres.mocerqjnksmhcjzxrewo" -d postgres \
              -v ON_ERROR_STOP=0 \
              -f supabase/migrations/003_data_scanner_functions.sql || true
          fi

  seed:
    name: Run S2 Scanners + Seed
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run S2 seed (repo + consolidation + data)
        env:
          GH_PAT:               ${{ secrets.GH_PAT }}
          BIDDEED_BOT_TOKEN:    ${{ secrets.BIDDEED_BOT_TOKEN }}
          BIDDEED_BOT_CHAT_ID:  ${{ secrets.BIDDEED_BOT_CHAT_ID }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:         ${{ secrets.SUPABASE_KEY }}
          SUPABASE_DB_URL:      ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          cd scanners
          python seed_s2.py

      - name: Notify on completion
        if: always()
        run: |
          STATUS="${{ job.status }}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BIDDEED_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.BIDDEED_BOT_CHAT_ID }}" \
            -d "text=Nexus S2 Repo+Data: ${STATUS} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || true
