name: Nexus S3 Secret + Domain
on:
  repository_dispatch:
    types: [nexus-s3]
  workflow_dispatch:

jobs:
  migrate:
    name: Apply Supabase Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply foundation migration (001 — 9 tables)
        env:
          SUPABASE_DB_URL:      ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/001_nexus_foundation.sql
            echo "✅ Migration 001 applied"
          elif [ -n "$SUPABASE_DB_PASSWORD" ]; then
            PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
              -h aws-0-us-east-1.pooler.supabase.com -p 5432 \
              -U "postgres.mocerqjnksmhcjzxrewo" -d postgres \
              -v ON_ERROR_STOP=1 \
              -f supabase/migrations/001_nexus_foundation.sql
            echo "✅ Migration 001 applied via password"
          else
            echo "⚠️  No DB credentials — skipping migration (tables may already exist)"
          fi

  seed:
    name: Run S3 Scanners + Seed
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run secret scanner
        env:
          GH_PAT:            ${{ secrets.GH_PAT }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
          BIDDEED_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          BIDDEED_BOT_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
        run: |
          cd scanners
          python3 secret_scanner.py
          echo "✅ Secret scan complete"

      - name: Run domain scanner
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
          BIDDEED_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          BIDDEED_BOT_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
        run: |
          cd scanners
          python3 domain_scanner.py
          echo "✅ Domain scan complete"

      - name: Telegram — S3 complete
        if: success()
        env:
          BIDDEED_BOT_TOKEN:   ${{ secrets.BIDDEED_BOT_TOKEN }}
          BIDDEED_BOT_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
          GH_PAT:              ${{ secrets.GH_PAT }}
        run: |
          cd scanners
          python3 -c "
import os, sys
sys.path.insert(0, '.')
from notifier import send_telegram
send_telegram(
  '✅ <b>NEXUS S3 GHA COMPLETE</b>\n\n'
  '🔐 Secret scanner: ran\n'
  '🌐 Domain scanner: ran\n'
  'Dashboard: https://nexus.zonewise.ai/secrets | https://nexus.zonewise.ai/domains'
)
"

      - name: Notify result
        if: always()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BIDDEED_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.BIDDEED_BOT_CHAT_ID }}" \
            -d "text=Nexus S3 Secret+Domain: ${{ job.status }} - ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
