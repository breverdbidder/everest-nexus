name: Nexus S1 Setup — Migrate + Seed

on:
  workflow_dispatch:
    inputs:
      skip_workflows:
        description: 'Skip workflow scan (faster for testing)'
        required: false
        type: boolean
        default: false

jobs:
  migrate:
    name: Run Supabase Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run migration 001 — Foundation (9 tables)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/001_nexus_foundation.sql
          elif [ -n "$SUPABASE_DB_PASSWORD" ]; then
            PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
              -h aws-0-us-east-1.pooler.supabase.com -p 5432 \
              -U "postgres.mocerqjnksmhcjzxrewo" -d postgres \
              -v ON_ERROR_STOP=1 \
              -f supabase/migrations/001_nexus_foundation.sql
          else
            echo "::error::No DB credentials — add SUPABASE_DB_URL or SUPABASE_DB_PASSWORD secret"
            exit 1
          fi
          echo "✅ Migration 001 complete"

      - name: Run migration 002 — pg_cron jobs
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/002_cron_jobs.sql
          elif [ -n "$SUPABASE_DB_PASSWORD" ]; then
            PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
              -h aws-0-us-east-1.pooler.supabase.com -p 5432 \
              -U "postgres.mocerqjnksmhcjzxrewo" -d postgres \
              -v ON_ERROR_STOP=1 \
              -f supabase/migrations/002_cron_jobs.sql
          fi
          echo "✅ Migration 002 complete"

  seed:
    name: Seed Repos + Workflows
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Seed nexus_repos (50 repos, tiered)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BIDDEED_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          BIDDEED_BOT_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
        run: |
          cd scanners
          python seed_repos.py
          echo "✅ nexus_repos seeded"

      - name: Seed nexus_workflows (initial scan)
        if: ${{ github.event.inputs.skip_workflows != 'true' }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BIDDEED_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          BIDDEED_BOT_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
        run: |
          cd scanners
          python seed_workflows.py
          echo "✅ nexus_workflows seeded"

      - name: Notify S1 complete
        if: always()
        env:
          BIDDEED_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          BIDDEED_BOT_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            TEXT="✅ NEXUS S1 SETUP COMPLETE%0A%0A• 9 tables created%0A• nexus_repos seeded (tiered)%0A• nexus_workflows seeded%0A• pg_cron jobs active%0A%0Ahttps://nexus.zonewise.ai"
          else
            TEXT="⚠️ Nexus S1 Setup: $STATUS — check GHA"
          fi
          curl -s -X POST "https://api.telegram.org/bot${BIDDEED_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${BIDDEED_BOT_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d "parse_mode=HTML" || true
