name: Nexus S5 Integration + Eval
on:
  repository_dispatch:
    types: [nexus-s5]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Claude Code on Hetzner
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 50m
          envs: CLAUDE_OAUTH_B64,GH_PAT,BIDDEED_BOT_TOKEN,BIDDEED_BOT_CHAT_ID,SUPABASE_URL,SUPABASE_KEY
          script: |
            set -e
            OAUTH_TOKEN=$(echo "$CLAUDE_OAUTH_B64" | base64 -d)
            su - claude -c "export CLAUDE_CODE_OAUTH_TOKEN='$OAUTH_TOKEN' && export NPM_CONFIG_PREFIX=/home/claude/.npm-global && export PATH=/home/claude/.npm-global/bin:\$PATH && export BIDDEED_BOT_TOKEN='$BIDDEED_BOT_TOKEN' && export BIDDEED_BOT_CHAT_ID='$BIDDEED_BOT_CHAT_ID' && export GH_PAT='$GH_PAT' && export SUPABASE_URL='$SUPABASE_URL' && export SUPABASE_KEY='$SUPABASE_KEY' && cd /home/claude/repos/everest-nexus && git pull origin main && claude -p 'MISSION: Nexus S5 — Integration + AUTOLOOP Eval. Read docs/EVEREST-NEXUS-SPEC.md.

S5.1 CLAUDE AI INGESTION: Create scanners/ingest.py with functions: push_task(task_dict) posts to nexus_tasks via Supabase REST, push_session(session_dict) posts to nexus_chat_sessions, push_batch(tasks_list) bulk upserts. These are shell-callable so Claude AI can invoke via bash_tool during chats. Include a CLI wrapper: python3 scanners/ingest.py --task \"description\" --priority P1 --project nexus --owner \"Claude Code\".

S5.2 TELEGRAM BOT WIRING: Create scanners/bot_nexus.py that integrates with the existing @BidDeedAI_bot (token from BIDDEED_BOT_TOKEN env). Implements webhook handler for commands: /tasks, /p0, /p1, /stale, /bump ID, /demote ID, /done ID, /skip ID, /block ID, /digest, /nexus (dashboard link + quick stats). Each command queries or updates nexus_tasks via Supabase REST. Format responses as Telegram HTML.

S5.3 DIGEST FUNCTION: Create scanners/digest.py that builds the morning/evening digest message per spec format: P0 critical count, completed since last digest, P1 needing attention, ecosystem health (repos/workflows/stale counts), dashboard link. Callable via: python3 scanners/digest.py --send (builds and sends to Telegram).

S5.4 AUTOLOOP EVAL: Create eval/eval.json with 25 binary assertions: 5 migration (tables exist, columns correct), 5 task engine (priority rules, escalation logic), 5 scanners (repos=50, workflows detected, secrets found, domains checked), 5 dashboard (package.json exists, pages exist, supabase client exists), 5 telegram (commands defined, digest builds). Create eval/eval_runner.py that runs assertions and reports score.

S5.5 GHA WORKFLOWS: Create .github/workflows/nexus-eval.yml (nightly 3AM EST AUTOLOOP), .github/workflows/nexus-digest.yml (scheduled 9AM+5PM EST digest sender).

S5.6 Run eval and report score. Send Telegram with final score and full Nexus status.

Git prefix NEXUS:, push main, Telegram notify.' --dangerously-skip-permissions"
        env:
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          GH_PAT: ${{ secrets.GH_PAT }}
          BIDDEED_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          BIDDEED_BOT_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - name: Notify
        if: always()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BIDDEED_BOT_TOKEN }}/sendMessage" -d "chat_id=${{ secrets.BIDDEED_BOT_CHAT_ID }}" -d "text=Nexus S5 Integration+Eval: ${{ job.status }} - ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
