name: Nexus S1 Task + Workflow Intelligence

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Get secrets from cli-anything-biddeed
        id: secrets
        run: |
          echo "Using repository secrets directly"
          
      - name: Claude Code on Hetzner
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 80m
          envs: CLAUDE_OAUTH_B64,GH_PAT,BIDDEED_BOT_TOKEN,BIDDEED_BOT_CHAT_ID,SUPABASE_URL,SUPABASE_KEY
          script: |
            set -e
            OAUTH_TOKEN=$(echo "$CLAUDE_OAUTH_B64" | base64 -d)
            su - claude -c "
              export CLAUDE_CODE_OAUTH_TOKEN='$OAUTH_TOKEN'
              export NPM_CONFIG_PREFIX=/home/claude/.npm-global
              export PATH=/home/claude/.npm-global/bin:\$PATH
              export BIDDEED_BOT_TOKEN='$BIDDEED_BOT_TOKEN'
              export BIDDEED_BOT_CHAT_ID='$BIDDEED_BOT_CHAT_ID'
              export GH_PAT='$GH_PAT'
              export SUPABASE_URL='$SUPABASE_URL'
              export SUPABASE_KEY='$SUPABASE_KEY'
              mkdir -p /home/claude/repos
              cd /home/claude/repos
              if [ -d everest-nexus ]; then cd everest-nexus && git pull origin main; else git clone https://${GH_PAT}@github.com/breverdbidder/everest-nexus.git && cd everest-nexus; fi
              claude -p 'MISSION: Everest Nexus S1 — Task Intelligence + Workflow Intelligence. Read docs/EVEREST-NEXUS-SPEC.md and docs/EVEREST-NEXUS-PLAN.md for full context.

S1.1 SUPABASE MIGRATION: Create supabase/migrations/001_nexus_foundation.sql. Create ALL 9 tables: nexus_tasks (with priority P0-P3, project, owner, sla_deadline, escalation_count, auto_priority, all columns from spec), nexus_workflows, nexus_repos (with consolidation_group, consolidation_recommendation, health_score), nexus_tables, nexus_secrets, nexus_domains, nexus_notifications, nexus_chat_sessions, nexus_insights. All indexes from spec. RLS: anon SELECT, service_role ALL. Realtime on nexus_tasks and nexus_notifications. Run via curl to Supabase REST at https://mocerqjnksmhcjzxrewo.supabase.co.

S1.2 TASK ENGINE: Create scanners/task_engine.py (create_task, update_status, auto_assign_priority with rules: blocked=P0, owner Ariel=P1, routine=P2, docs=P3, compute_sla_deadline, get_active, get_stale). Create scanners/escalation.py (check_p0_escalation 2hr repeat, send_accountability 4hr, build_digest 9AM/5PM format). Create scanners/notifier.py (send_telegram, route_by_priority).

S1.3 WORKFLOW SCANNER: Create scanners/workflow_scanner.py. Scan ALL repos under breverdbidder (paginate GitHub API 50+ repos), list workflows, fetch last 5 runs, compute success_rate, detect dead workflows (active + 0 runs 30d), estimate cost. Write to nexus_workflows. Create scanners/seed_workflows.py and run initial scan.

S1.4 TELEGRAM COMMANDS: Create scanners/telegram_commands.py with /tasks /p0 /p1 /stale /bump /demote /done /skip /block /digest /nexus commands.

S1.5 PG_CRON: Create supabase/migrations/002_cron_jobs.sql with 9 cron jobs per spec.

S1.6 REPO SEED: Create scanners/seed_repos.py. Fetch all breverdbidder repos. Tier CORE=[cli-anything-biddeed,zonewise-web,biddeed-ai,biddeed-ai-ui,claude-code-telegram-control,life-os,cliproxy-gateway,everest-nexus], ACTIVE=[zonewise,goviralbitch,superpowers,zonewise-landing,biddeed-landing,brevard-bidder-landing,zonewise-desktop], MONITORED=rest. Insert nexus_repos. Compute stale_days and health_score. Run it.

COMMIT: git config user.email ci@biddeed.ai, git config user.name BidDeed-CI, prefix NEXUS:, push main. Send Telegram summary when done.' --dangerously-skip-permissions
            "
        env:
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          GH_PAT: ${{ secrets.GH_PAT }}
          BIDDEED_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          BIDDEED_BOT_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Notify
        if: always()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BIDDEED_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.BIDDEED_BOT_CHAT_ID }}" \
            -d "text=Nexus S1: ${{ job.status }} - ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
