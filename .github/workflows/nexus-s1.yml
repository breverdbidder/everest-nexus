name: Nexus S1

on:
  repository_dispatch:
    types: [nexus-s1]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Claude Code on Hetzner
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 80m
          envs: CLAUDE_OAUTH_B64,GH_PAT,BIDDEED_BOT_TOKEN,BIDDEED_BOT_CHAT_ID,SUPABASE_URL,SUPABASE_KEY
          script: |
            set -e
            OAUTH_TOKEN=$(echo "$CLAUDE_OAUTH_B64" | base64 -d)
            su - claude -c "export CLAUDE_CODE_OAUTH_TOKEN='$OAUTH_TOKEN' && export NPM_CONFIG_PREFIX=/home/claude/.npm-global && export PATH=/home/claude/.npm-global/bin:\$PATH && export BIDDEED_BOT_TOKEN='$BIDDEED_BOT_TOKEN' && export BIDDEED_BOT_CHAT_ID='$BIDDEED_BOT_CHAT_ID' && export GH_PAT='$GH_PAT' && export SUPABASE_URL='$SUPABASE_URL' && export SUPABASE_KEY='$SUPABASE_KEY' && mkdir -p /home/claude/repos && cd /home/claude/repos && (cd everest-nexus 2>/dev/null && git pull origin main || (git clone https://\${GH_PAT}@github.com/breverdbidder/everest-nexus.git && cd everest-nexus)) && claude -p 'Read docs/EVEREST-NEXUS-SPEC.md and docs/EVEREST-NEXUS-PLAN.md. Execute ALL S1 tasks: S1.1 Create 9 Supabase tables (nexus_tasks, nexus_workflows, nexus_repos, nexus_tables, nexus_secrets, nexus_domains, nexus_notifications, nexus_chat_sessions, nexus_insights) with all columns, indexes, RLS, and Realtime per spec. S1.2 Create task engine (scanners/task_engine.py, escalation.py, notifier.py) with P0 escalation 2hr repeat and 4hr accountability. S1.3 Create workflow scanner for all 50 breverdbidder repos. S1.4 Create Telegram command handlers. S1.5 Create pg_cron jobs. S1.6 Seed all repos into nexus_repos with correct tiers. Prefix NEXUS:, push main, Telegram notify when done.' --dangerously-skip-permissions"
        env:
          CLAUDE_OAUTH_B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
          GH_PAT: ${{ secrets.GH_PAT }}
          BIDDEED_BOT_TOKEN: ${{ secrets.BIDDEED_BOT_TOKEN }}
          BIDDEED_BOT_CHAT_ID: ${{ secrets.BIDDEED_BOT_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - name: Notify
        if: always()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BIDDEED_BOT_TOKEN }}/sendMessage" -d "chat_id=${{ secrets.BIDDEED_BOT_CHAT_ID }}" -d "text=Nexus S1: ${{ job.status }} - ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
